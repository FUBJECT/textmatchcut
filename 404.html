<!DOCTYPE html>
<html lang="en" data-ui-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — TypePin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="./fonts-7cf0992c.css">
  <script>
    (function () {
      try {
        var rawQ = new URLSearchParams(window.location.search).get("lang");
        var q = rawQ === "hant" || rawQ === "zh-TW" || rawQ === "zh-HK" || rawQ === "zh-Hant" || rawQ === "tw"
          ? "hant"
          : (rawQ === "zh" || rawQ === "zh-CN" ? "zh" : (rawQ === "en" ? "en" : ""));
        var saved = q || window.localStorage.getItem("tmc_ui_lang");
        if (saved === "zh" || saved === "hant" || saved === "en") {
          document.documentElement.dataset.uiLang = saved;
          document.documentElement.lang = saved === "hant" ? "zh-Hant" : (saved === "zh" ? "zh-CN" : "en");
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --paper: #f6f2e9;
      --panel: #fbf8f1;
      --surface: #ffffff;
      --ink: #141210;
      --muted: #665f54;
      --line: #dfd7c8;
      --track: #ebe4d7;
      --hl: #ffe600;
      --r-panel: 12px;
      --r-ctrl: 8px;
      --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-serif: "Playfair Display", Georgia, "Times New Roman", "Noto Serif SC", SimSun, "Songti SC", serif;
    }
    html[data-ui-lang="zh"] {
      --font-sans: "Noto Sans SC", Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-serif: "Noto Serif SC", "Playfair Display", SimSun, "Songti SC", serif;
    }
    html[data-ui-lang="hant"] {
      --font-sans: "Noto Sans TC", Inter, "PingFang TC", "Microsoft JhengHei", sans-serif;
      --font-serif: "Noto Serif TC", "Playfair Display", PMingLiU, "Songti TC", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    html[data-ui-lang="en"] .lang-zh,
    html[data-ui-lang="en"] .lang-hant,
    html:not([data-ui-lang]) .lang-zh,
    html:not([data-ui-lang]) .lang-hant { display: none !important; }
    html[data-ui-lang="zh"] .lang-en,
    html[data-ui-lang="zh"] .lang-hant { display: none !important; }
    html[data-ui-lang="hant"] .lang-en,
    html[data-ui-lang="hant"] .lang-zh { display: none !important; }

    .site-nav {
      position: sticky;
      top: 0;
      z-index: 90;
      height: 52px;
      background: rgba(246, 242, 233, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      max-width: 1180px;
      height: 100%;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      color: var(--ink);
      text-decoration: none;
      font-family: var(--font-serif);
      font-size: 19px;
      line-height: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .brand-logo:hover { color: var(--ink); text-decoration: none; }
    .brand-cut {
      display: inline-flex;
      align-items: center;
      margin-left: 6px;
      padding-left: 7px;
      border-left: 1.5px solid var(--ink);
      background: linear-gradient(transparent 62%, var(--hl) 62%, var(--hl) 92%, transparent 92%);
    }
    .seg {
      display: inline-flex;
      align-items: center;
      padding: 2px;
      gap: 2px;
      background: var(--track);
      border: 1px solid var(--line);
      border-radius: var(--r-ctrl);
    }
    .seg button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 26px;
      padding: 0 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      line-height: 20px;
      font-weight: 500;
      cursor: pointer;
    }
    .seg button:hover:not(.on) { color: var(--ink); }
    .seg button.on {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(20, 18, 16, 0.1), 0 0 0 1px rgba(20, 18, 16, 0.06);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 80px;
    }
    .legal-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-panel);
      padding: 36px 40px;
      box-shadow: 0 2px 10px rgba(20, 18, 16, 0.03);
    }
    .kicker {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    html[data-ui-lang="zh"] .kicker,
    html[data-ui-lang="hant"] .kicker {
      letter-spacing: 0.12em;
      text-transform: none;
    }
    h1 {
      margin: 0 0 12px;
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 36px);
      line-height: 1.24;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    html[data-ui-lang="zh"] h1,
    html[data-ui-lang="hant"] h1 {
      letter-spacing: -0.01em;
      line-height: 1.35;
    }
    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 24px;
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 2px;
    }
    .home-link:hover { color: var(--ink); opacity: 0.7; text-decoration: none; }
    .home-link svg { display: block; }

    @media (max-width: 860px) {
      .nav-inner { padding: 0 12px; }
      .brand-logo { font-size: 16px; line-height: 22px; }
      .brand-cut { margin-left: 4px; padding-left: 5px; }
      main { padding: 40px 16px 64px; }
      .legal-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a class="brand-logo" href="./index.html">
        <span class="lang-en">Type<span class="brand-cut">Pin</span></span>
        <span class="lang-zh">钉<span class="brand-cut">字</span></span>
        <span class="lang-hant">釘<span class="brand-cut">字</span></span>
      </a>
      <div class="seg" id="uiLangBtns" role="group" aria-label="Interface language">
        <button type="button" data-ui-lang="en">EN</button>
        <button type="button" data-ui-lang="zh">简体</button>
        <button type="button" data-ui-lang="hant">繁體</button>
      </div>
    </div>
  </header>

  <main>
    <article class="legal-card">
      <p class="kicker">
        <span class="lang-en">404</span>
        <span class="lang-zh">404</span>
        <span class="lang-hant">404</span>
      </p>
      <h1>
        <span class="lang-en">Page not found.</span>
        <span class="lang-zh">找不到这个页面</span>
        <span class="lang-hant">找不到這個頁面</span>
      </h1>
      <p class="lead">
        <span class="lang-en">This address isn’t on TypePin. It may have been moved, or the link is incomplete.</span>
        <span class="lang-zh">这个地址在钉字上不存在。页面可能已经换了位置，或链接不完整。</span>
        <span class="lang-hant">這個地址在釘字上不存在。頁面可能已經換了位置，或連結不完整。</span>
      </p>
      <a class="home-link" href="./index.html">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5L5.5 8L10 12.5"/><path d="M6 8H13"/></svg>
        <span class="lang-en">Back to home</span>
        <span class="lang-zh">返回首页</span>
        <span class="lang-hant">返回首頁</span>
      </a>
    </article>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      function current() {
        return root.dataset.uiLang || "en";
      }
      function apply(lang) {
        if (lang !== "en" && lang !== "zh" && lang !== "hant") lang = "en";
        root.dataset.uiLang = lang;
        root.lang = lang === "hant" ? "zh-Hant" : (lang === "zh" ? "zh-CN" : "en");
        try { window.localStorage.setItem("tmc_ui_lang", lang); } catch (e) {}
        var titles = {
          en: "Page not found — TypePin",
          zh: "找不到页面 — 钉字",
          hant: "找不到頁面 — 釘字"
        };
        document.title = titles[lang];
        document.querySelectorAll("#uiLangBtns button").forEach(function (btn) {
          btn.classList.toggle("on", btn.getAttribute("data-ui-lang") === lang);
        });
      }
      document.querySelectorAll("#uiLangBtns button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          apply(btn.getAttribute("data-ui-lang"));
        });
      });
      apply(current());
    })();
  </script>
</body>
</html>
